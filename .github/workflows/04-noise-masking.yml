name: "Step 4: Noise Masking & Commit"
on:
  workflow_run:
    workflows: ["Step 3: Crop and Wipe"]
    types:
      - completed

jobs:
  run-noise-masking:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install opencv-python-headless numpy

      - name: Download Previous Artifacts
        uses: actions/download-artifact@v4
        with:
          name: step3-output
          path: output/

      - name: Run Script
        run: python scripts/04_noise_masking.py

      - name: Commit Final Clean Image
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p final_distribution/
          cp output/final_bypass_image.jpg final_distribution/
          git add final_distribution/
          git commit -m "Generated clean, humanized image asset" || exit 0
          git push
          
