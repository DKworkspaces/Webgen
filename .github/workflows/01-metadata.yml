name: "Step 1: Replace Metadata"
on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

jobs:
  run-metadata-strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pillow piexif

      - name: Run Script
        run: python scripts/01_replace_metadata.py

      - name: Upload Intermediate Files
        uses: actions/upload-artifact@v4
        with:
          name: step1-output
          path: output/
