name: "Step 2: Disrupted Geometry"
on:
  workflow_run:
    workflows: ["Step 1: Replace Metadata"]
    types:
      - completed

jobs:
  run-pixel-disruption:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install opencv-python-headless numpy

      - name: Download Previous Artifacts
        uses: actions/download-artifact@v4
        with:
          name: step1-output
          path: output/

      - name: Run Script
        run: python scripts/02_pixel_disruption.py

      - name: Upload Intermediate Files
        uses: actions/upload-artifact@v4
        with:
          name: step2-output
          path: output/
