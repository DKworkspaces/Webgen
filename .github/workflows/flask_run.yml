name: 5-Hour Flask Runner with Public URL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-flask:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Node.js (for tunneling tool)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start Public HTTPS Tunnel
      # This securely tunnels port 5000 and dumps the live https address into your logs
      run: |
        ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:5000 qr@free.pinggy.io > tunnel_info.txt &
        echo "Waiting for secure HTTPS link to generate..."
        sleep 8
        echo "=== YOUR SECURE PUBLIC FLASK URLS ARE BELOW ==="
        cat tunnel_info.txt
        echo "================================================"
        
    - name: Run 5-Hour Script
      run: python runner.py
