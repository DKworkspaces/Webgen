name: 5-Hour Flask Runner with Public URL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-flask:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Node.js (for tunneling tool)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start Public Tunnel
      # This creates a public link to port 5000 and saves the link to logs
      run: |
        npm install -g localtunnel
        lt --port 5000 > tunnel_url.txt &
        echo "Waiting for public URL to generate..."
        sleep 5
        echo "=== YOUR PUBLIC FLASK URL IS BELOW ==="
        cat tunnel_url.txt
        echo "======================================"

    - name: Run 5-Hour Script
      run: python runner.py
