name: Anti-Forensic Image Pipeline

on:
  push:
    # Restrict workflow execution strictly to the production branch
    branches:
      - production
    paths:
      # Trigger the pipeline ONLY when standard images are added to input_images
      - 'ipimages/**/*.jpg'
      - 'ipimages/**/*.jpeg'
      - 'ipimages/**/*.png'
  workflow_dispatch: # Allows you to run it manually via GitHub UI

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants GitHub permission to commit processed images back

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Forensic Script Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python-headless numpy piexif

    - name: Run Asymmetric Lattice Scrambler
      run: python scramble.py

    - name: Commit and Push Humanized Images
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add opimages/*.webp
        
        # Check if there are actual updates to commit so the pipeline doesn't error out
        if git diff --staged --quiet; then
          echo "No new humanized images to commit."
        else
          git commit -m "chore: auto-generated scrambled humanized webp images [skip ci]"
          git push
        fi
