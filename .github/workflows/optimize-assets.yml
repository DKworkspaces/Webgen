name: Optimize Assets

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight. Change as needed.
  workflow_dispatch: # Enables manual trigger

permissions:
  contents: write # Required to commit optimized files back to the repo

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-level: '20'

      # --- CSS MINIFICATION ---
      - name: Minify CSS
        run: |
          mkdir -p web/css
          npm install -g clean-css-cli
          if [ -d "src/css" ]; then
            for file in src/css/*.css; do
              [ -e "$file" ] || continue
              filename=$(basename "$file")
              cleancss -o "web/css/$filename" "$file"
            done
          fi

      # --- JS MINIFICATION ---
      - name: Minify JS
        run: |
          mkdir -p web/js
          npm install -g terser
          if [ -d "src/js" ]; then
            for file in src/js/*.js; do
              [ -e "$file" ] || continue
              filename=$(basename "$file")
              terser "$file" --compress --mangle -o "web/js/$filename"
            done
          fi
          
      - name: Pre-compress JS and CSS with Brotli
        uses: stefh/ghaction-CompressFiles@v2
        with:
          path: './web/js,./web/css'           # <-- Change this to your actual build/output folder
          extensions: '.js,.css'               # <-- Only targets text assets
          tools: 'brotli'                      # <-- Runs Brotli only (excluding gzip)
          

      # --- IMAGE CONVERSION & COMPRESSION ---
      - name: Convert Images to WebP
        run: |
          mkdir -p media/images
          sudo apt-get update && sudo apt-get install -y webp
          if [ -d "src/media" ]; then
            for file in src/media/*.{jpg,jpeg,png,tiff}; do
              [ -e "$file" ] || continue
              filename=$(basename "$file")
              filename_no_ext="${filename%.*}"
              # Converts to webp with standard quality compression (lossy 75%)
              cwebp -q 75 "$file" -o "media/images/${filename_no_ext}.webp"
            done
          fi

      # --- COMMIT AND PUSH CHANGES ---
      - name: Commit Optimized Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add web/css/ web/js/ media/images/
          git add web/js/*.br web/css/*.br
          
          # Only commit if there are actual changes to prevent workflow failure
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated asset optimization [skip ci]"
            git push
          fi
          
