name: Anti-AI Image Sanitizer

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to your input image'
        required: true
        default: 'source_images/original_image.jpg'
      output_file:
        description: 'Path where the processed output should be saved'
        required: true
        default: 'final_distribution/1/final_bypass_image.jpg'
jobs:
  sanitize:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
    # 👇 STEP 1: Add this delay step at the very top of your steps
    - name: Cooldown Delay to Prevent Race Conditions
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        echo "Waiting 15 seconds for previous git operations to clear..."
        sleep 15
        
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Crucial: Checkout the exact branch/commit reference that triggered the original run
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: pip install Pillow numpy

    - name: Run Anti-Detection Script
      run: python scripts/bypass.py

    - name: Commit and Push Cleaned Images
      run: |
        git config --local user.email "lazy-specialist@github.com"
        git config --local user.name "Lazy Anti-AI Bot"
        git add .
        # Check if there are actually any changes to commit
        if ! git diff --quiet --staged; then
          git commit -m "Cleaned AI signatures via chain trigger"
          
          # 👇 THE LAZY MAGIC: Fetch latest remote changes and replay our commit on top
          git pull --rebase origin ${GITHUB_REF_NAME}
          
          git push origin HEAD:${GITHUB_REF_NAME}
        else
          echo "No image changes detected. Skipping push."
        fi
