name: Anti-AI Image Sanitizer

on:
  push:
    paths:
      - 'final_distribution/**'
    workflow_call: {} # 👈 This allows other workflows to call this one directly
      

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    steps:
    # 👇 STEP 1: Add this delay step at the very top of your steps
    - name: Cooldown Delay to Prevent Race Conditions
      run: |
        echo "Waiting 15 seconds for previous git operations to clear..."
        sleep 15
        
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Fetch all history to ensure rebase merges correctly
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: pip install Pillow numpy

    - name: Run Anti-Detection Script
      run: python scripts/bypass.py

    - name: Commit and Push Cleaned Images
      run: |
        git config --local user.email "lazy-specialist@github.com"
        git config --local user.name "Lazy Anti-AI Bot"
        git add .
        # Check if there are actually any changes to commit
        if ! git diff --quiet --staged; then
          git commit -m "Cleaned AI signatures via chain trigger"
          
          # 👇 THE LAZY MAGIC: Fetch latest remote changes and replay our commit on top
          git pull --rebase origin ${GITHUB_REF_NAME}
          
          git push origin HEAD:${GITHUB_REF_NAME}
        else
          echo "No image changes detected. Skipping push."
        fi
