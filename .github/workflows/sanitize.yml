name: Anti-AI Image Sanitizer

on:
  workflow_run:
    workflows: ["Production AI Signature Stripper Pipeline"] # 👈 Must match the name from Step 1 exactly
    types:
      - completed # 👈 Triggers immediately when the first file finishes executing

jobs:
  sanitize:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    # 👇 STEP 1: Add this delay step at the very top of your steps
    - name: Cooldown Delay to Prevent Race Conditions
      run: |
        echo "Waiting 15 seconds for previous git operations to clear..."
        sleep 15
        
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Crucial: Checkout the exact branch/commit reference that triggered the original run
        ref: ${{ github.event.workflow_run.head_branch }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: pip install Pillow numpy

    - name: Configure Git Credentials
      run:  |
        git config --local user.email "lazy-specialist@github.com"
        git config --local user.name "Lazy Anti-AI Bot"

    - name: Run Sequential Loop (5 Times)
      run: |
        git add .
        # Check if there are actually any changes to commit
        if ! git diff --quiet --staged; then
          git commit -m "Cleaned AI signatures via chain trigger"
          
          # 👇 THE LAZY MAGIC: Fetch latest remote changes and replay our commit on top
          git pull --rebase origin ${GITHUB_REF_NAME}
          
          git push origin HEAD:${GITHUB_REF_NAME}
        else
          echo "No image changes detected. Skipping push."
        fi
