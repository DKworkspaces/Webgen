name: Anti-AI Image Sanitizer

on:
  workflow_run:
    workflows: ["Production AI Signature Stripper Pipeline"] # 👈 Must match the name from Step 1 exactly
    types:
      - completed # 👈 Triggers immediately when the first file finishes executing

jobs:
  sanitize:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    # 👇 STEP 1: Add this delay step at the very top of your steps
    - name: Cooldown Delay to Prevent Race Conditions
      run: |
        echo "Waiting 15 seconds for previous git operations to clear..."
        sleep 15
        
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Crucial: Checkout the exact branch/commit reference that triggered the original run
        ref: ${{ github.event.workflow_run.head_branch }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: pip install Pillow numpy

    - name: Configure Git Credentials
      run:  |
        git config --local user.email "lazy-specialist@github.com"
        git config --local user.name "Lazy Anti-AI Bot"

    - name: Run Sequential Loop (5 Times)
      run: |
        for i in {1..5}
        do
          echo "=== Starting Iteration $i ==="
          
          # 1. Run your script to read, modify, and overwrite the image
          python scripts/bypass.py
          
          # 2. Stage the modified file
          git add .
          
          # 3. Commit and push only if changes happened
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: Iteration $i"
            
            # Pull with rebase to avoid conflicts if remote changes happen
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in iteration $i."
          fi
          
          echo "=== Completed Iteration $i ==="
          echo "-----------------------------------"
        done
