name: Anti-AI Image Sanitizer

on:
  push:
    paths:
      - 'output/**'

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install Dependencies
      run: pip install Pillow numpy

    - name: Run Anti-Detection Script
      run: python scripts/bypass.py

    - name: Commit and Push Cleaned Images
      run: |
        git config --local user.email "lazy-specialist@github.com"
        git config --local user.name "Lazy Anti-AI Bot"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Cleaned AI signatures" && git push)
