name: Strip AI Fingerprints from Images

on:
  push:
    # Triggers only when changes are made inside the 'images' directory
    paths:
      - 'src/images/**'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  clean-images:
    runs-on: ubuntu-latest
    
    # Grants the runner permission to read content and push modified files back to the repo
    permissions:
      contents: write

    steps:
      # 1. Check out your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install core system and Python requirements
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx
          pip install --upgrade pip
          pip install remove-ai-watermarks opencv-python

      # 4. Run your python image cleaning engine
      - name: Run AI Cleaning Engine
        run: python clean_images.py

      # 5. Automatically commit and push the updated images back to Github
      - name: Commit and Push Cleaned Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automatically stripped AI tracking metadata [skip ci]"
          file_pattern: 'src/clean/images/*'
          
