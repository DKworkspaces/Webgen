name: Process Code Assets

on:
  push:
    branches: [ assets ]

jobs:
  minify-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Assets
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 20

      - name: Install Minifiers
        run: npm install -g terser clean-css-cli

      - name: Process Files
        run: |
          mkdir -p dist/css dist/js
          # Compress all JS files
          for f in src/js/*.js; do [ -e "$f" ] && terser "$f" --compress --mangle -o "dist/js/$(basename "$f")"; done
          # Compress all CSS files
          for f in src/css/*.css; do [ -e "$f" ] && clean-css-cli -o "dist/css/$(basename "$f")" "$f"; done

      - name: Deploy to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: production
          target-folder: assets # Saves into assets/css and assets/js on production
          clean: false # Prevents overwriting work from other branches
          
