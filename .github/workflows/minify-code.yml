name: Auto Minify Assets

on:
  push:
    branches:
      - assets
    paths:
      - 'src/js/**'
      - 'src/css/**'

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Minifiers
        run: npm install -g terser clean-css-cli

      - name: Prepare Output Directories
        run: mkdir -p dist/js dist/css

      - name: Minify JavaScript
        run: |
          for f in src/js/*.js; do
            if [ -f "$f" ]; then
              terser "$f" --compress --mangle -o "dist/js/$(basename "$f" .js).min.js"
            fi
          done

      - name: Minify CSS
        run: |
          for f in src/css/*.css; do
            if [ -f "$f" ]; then
              cleancss -o "dist/css/$(basename "$f" .css).min.css" "$f"
            fi
          done

      - name: Commit and Push Minified Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-minify assets [skip ci]"
            git push origin assets
          fi
          
