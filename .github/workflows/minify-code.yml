name: Optimize Assets to Production

on:
  push:
    branches:
      - assets
    paths:
      - 'src/js/**'
      - 'src/css/**'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  minify-and-brotli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assets branch
        uses: actions/checkout@v4

      - name: Setup Node.js with Caching
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Minifiers and Compressor
        run: npm install -g terser clean-css-cli gzipper

      - name: Prepare Output Directories
        run: mkdir -p website/js website/css

      - name: Minify JavaScript
        run: |
          for f in src/js/*.js; do
            if [ -f "$f" ]; then
              terser "$f" --compress --mangle -o "website/js/$(basename "$f" .js).min.js"
            fi
          done

      - name: Minify CSS
        run: |
          for f in src/css/*.css; do
            if [ -f "$f" ]; then
              cleancss -o "website/css/$(basename "$f" .css).min.css" "$f"
            fi
          done

      - name: Brotli Compress Assets
        run: gzipper compress website/js/ website/css/ --brotli --keep-original

      - name: Checkout Production Branch
        uses: actions/checkout@v4
        with:
          ref: production
          path: prod-branch

      - name: Sync and Push to Production Branch
        run: |
          mkdir -p prod-branch/website/js prod-branch/website/css
          cp -r website/js/* prod-branch/website/js/
          cp -r website/css/* prod-branch/website/css/
          
          cd prod-branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add website/js/ website/css/
          
          if git diff --staged --quiet; then
            echo "No asset changes to deploy"
          else
            git commit -m "deploy: automated assets & brotli compression [skip ci]"
            git push origin production
          fi
          
