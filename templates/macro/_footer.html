{# Component: Footer Mega Menu #}
{% macro r_fmega(columns) %}
{% for col in columns %}
<!-- Column -->
<div class="f-mc"><input type="checkbox" id="{{ col.id }}" class="f-st" aria-hidden="true"><label for="{{ col.id }}" class="f-pt">{{ col.title }}
<!-- Pulling the master Chevron asset initialized inside the header frame -->
<svg class="f-ch"width="18"height="18"aria-hidden="true"><use href="#icon-chevron"/></svg>
</label><ul class="ml" id="{{ col.link_id }}">{% for lk in col.links %}<li><a href="{{ lk.url }}">{{ lk.title }}</a></li>{% endfor %}</ul></div>
{% endfor %}
{% endmacro %}
