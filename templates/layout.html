<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
</head>
<body>
    <!-- Dynamically generated navigation menu -->
    <nav>
        {% for link in nav_links %}
            <a href="{{ link.url }}">{{ link.title }}</a> 
            {% if not loop.last %} | {% endif %}
        {% endfor %}
    </nav>
    <hr>
    <!-- Main page content -->
    <h1>{{ page.title }}</h1>
    <p>{{ page.content }}</p>
</body>
</html>
